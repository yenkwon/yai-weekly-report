name: worklife-morning-watchdog

# Independent recovery path for a missed yai-worklife-agent scheduled event.
on:
  schedule:
    - cron: "20 20 * * *" # KST 05:20
    - cron: "20 21 * * *" # KST 06:20
    - cron: "20 22 * * *" # KST 07:20
    - cron: "0 23 * * *"  # KST 08:00 final recovery
  push:
    branches: [main]
    paths: [.github/workflows/worklife-morning-watchdog.yml]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ensure-morning-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Check delivery and dispatch recovery
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKLIFE_REPO_TOKEN }}
          WORKLIFE_REPO: yenkwon/yai-worklife-agent
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "WORKLIFE_REPO_TOKEN is not configured"
            exit 1
          fi

          api="https://api.github.com/repos/${WORKLIFE_REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          today="$(TZ=Asia/Seoul date +%F)"
          hour="$(TZ=Asia/Seoul date +%H)"
          minute="$(TZ=Asia/Seoul date +%M)"
          now_minutes=$((10#$hour * 60 + 10#$minute))

          encoded="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${api}/contents/store/briefing-history.json?ref=main" | jq -r '.content')"
          sent_date="$(printf '%s' "$encoded" | tr -d '\n' | base64 --decode | jq -r '.last_sent_date // ""')"

          if [ "$sent_date" = "$today" ]; then
            echo "Morning briefing already delivered for $today"
            exit 0
          fi

          if [ "$now_minutes" -lt 300 ] || [ "$now_minutes" -ge 510 ]; then
            echo "Morning briefing is missing for $today, but ${hour}:${minute} KST is outside the 05:00-08:29 recovery window"
            exit 0
          fi

          echo "Morning briefing is missing for $today; dispatching recovery workflow"
          curl --fail-with-body --silent --show-error \
            --request POST \
            "${auth[@]}" \
            "${api}/actions/workflows/morning-briefing.yml/dispatches" \
            --data '{"ref":"main"}'
          echo "Recovery dispatch accepted"
